		<title>MATH-18A Slides</title>

		<style>
			:root {
				--background: #FAFAFA;
				--primary: #111111;
				--secondary: #bbbbbb;
				--accent: 56, 110, 246; /* #386ef6 */
				--definition: 120, 46, 211; /* #782ED3 */
				--theorem: 233, 84, 15; /* e9540f */
			}

			html, body {
				background-color: #FAFAFA;
				padding: 0;
				margin: 0;
				color: var(--primary);
			}
			
			h1, h2, h3, h4, h5, h6, p {
				margin: 0;
				padding: 0;
				line-height: 135%;
				font-weight: 400;
				font-family: "Instrument Sans", Helvetica, sans-serif;
			}
			
			h1 {
				font-family: "Instrument Serif", Cambria, serif;
				font-size: 4rem;
			}

			.header {
				background-color: rgb(var(--accent));
			}
			
			.content {
				width: min(90%, 1000px);
				margin: 0 auto;
				padding: 4rem 2rem;
			}

			h3 {
				font-size: 1.65rem;
				font-weight: 700;
			}

			p {
				font-size: 1.65rem;
				font-weight: 400;
				margin: 1rem 0;
			}
			
			a {
				color: var(--primary);
				transition: 0.25s ease-in-out;
				text-decoration: underline 2px rgba(var(--accent), 0.35);
				text-underline-offset: 0.3rem;
			} a:hover {
				color: rgb(var(--accent));
				text-decoration: underline 2px rgba(var(--accent), 1);
				transition: 0.25s ease-in-out;
			}
		</style>
